<!doctype html>
<html lang="en" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Email Verification | A1 Opportunities</title>
<link rel="stylesheet" href="/onboarding.css">
<link rel="stylesheet" href="/preview-info.css">
<script src="/verify.js" defer></script>
<link rel="icon" type="image/svg+xml" href="/branding/a1-opps/icon-blue.svg"></head><body>
<header class="site-header"><div class="nav-container">
  <a class="brand" href="/" aria-label="A1 Opportunities"><span class="a1-opps-brand a1-opps-brand--light" dir="ltr" aria-label="A1 Opportunities"><span class="a1-opps-word-a1" aria-hidden="true">A1</span><span class="a1-opps-word-name" aria-hidden="true">Opportunities</span></span></a>
  <div class="nav-actions">
    <div id="switchLanguage" class="locale-switch" role="group" aria-label="Interface language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ar" aria-pressed="false">AR</button></div>
    <a href="/ambassador" class="signin-link" data-i18n="signin">Ambassador Sign In</a>
  </div>
</div></header>
<main class="hero info-hero">
 <div class="info-shell">
  <section class="info-card" aria-labelledby="verifyHeading">
    <span class="section-kicker" id="verifyEyebrow" data-i18n="eyebrow">EMAIL VERIFICATION</span>
    <h1 id="verifyHeading" data-i18n="heading">Confirm your email</h1>
    <p id="verificationMessage" class="info-status" role="status" aria-live="polite">Checking your activation link...</p>
    <a href="/ambassador" id="goToLogin" class="submit-button info-action" hidden data-i18n="signinAction">Go to Ambassador Sign In</a>
    <a href="/" id="returnRegistration" class="info-secondary" data-i18n="returnRegistration">Back to registration</a>
  </section>
 </div>
</main>
<footer><div class="footer-inner"><span dir="ltr">A1 Opportunities</span><span data-a1-platform-copyright dir="ltr">© 2026 A1 Media Network. All rights reserved.</span></div></footer>
